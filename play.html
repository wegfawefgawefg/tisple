<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Tisple Player</title>
<style>
/* the Apple II's look: black, the hi-res colours, hard edges, the machine's own letters
   (pad.js draws them; .lbl shows its colour through the letters' mask) */
:root {
    --black: #000;
    --white: #fff;
    --green: #42c600;
    --violet: #ba38ff;
    --orange: #e55523;
    --blue: #1ea8db;
    --dim: #2f7a12;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    margin: 0; height: 100%; background: var(--black); color: var(--white);
    overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none;
}
body {
    display: flex; flex-direction: column; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
             env(safe-area-inset-left);
}
.lbl {
    display: block; flex: none; background: currentColor;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
}
[hidden] { display: none !important; }

/* the bar: small, one line */
#bar {
    flex: none; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px;
    border-bottom: 2px solid var(--dim); color: var(--green);
}
#bar .name { flex: 1; color: var(--white); overflow: hidden; }
#bar .btn {
    display: flex; align-items: center; height: 22px; padding: 0 6px; text-decoration: none;
    border: 2px solid var(--green); color: var(--green); background: var(--black); cursor: pointer;
}
#bar .btn:active { background: var(--green); color: var(--black); }
#bar .btn.off { border-color: var(--dim); color: var(--dim); }
#rec { color: var(--orange); }

/* the screen and the controls */
#main { flex: 1; display: flex; min-height: 0; }
#stage {
    position: relative; display: flex; align-items: center; justify-content: center;
    min-width: 0; min-height: 0; overflow: hidden;
}
#screen-wrap { position: relative; background: var(--black); }
canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
}
.flash { position: absolute; pointer-events: none; outline: 2px solid var(--white); }
#start {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.7); color: var(--green); cursor: pointer;
}
#side { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#pad { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;
       padding: 10px 12px 14px; min-height: 0; }
.row { display: grid; gap: 10px; }
.row.small { display: flex; justify-content: flex-end; gap: 8px; }
.row.medium { height: 56px; }
.row.big { flex: 1 1 0; min-height: 56px; max-height: 150px; }
#keyboard { display: none; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 6px 8px; }
#keyboard.open { display: grid; }
#keyboard .key { height: 34px; padding: 0; }
#status { flex: none; height: 16px; padding: 3px 8px; color: var(--dim); }

/* portrait: the screen across the top, the buttons under it */
body.tall #main { flex-direction: column; }
body.tall #stage { flex: none; }
body.tall #side { flex: 1; }
/* landscape and desktop: the screen as big as fits, the buttons (if any) beside it */
body.wide #main { flex-direction: row; }
body.wide #stage { flex: 1 1 0; }
body.wide #side { flex: none; width: min(36vw, 360px); justify-content: center; }
body.wide #pad { flex: none; }
body.no-pad #pad { display: none; }
body.wide.no-pad #side:not(.kb) { display: none; }

/* a button: a hard-edged frame in its colour, slanted like the game's tray; pressed, filled */
.key {
    position: relative; display: flex; align-items: center; justify-content: center;
    min-width: 0; color: var(--c); cursor: pointer; --c: var(--green); --fill: var(--black);
}
.key::before {
    content: ""; position: absolute; inset: 0; background: var(--fill);
    border: 3px solid var(--c); transform: skewX(-6deg);
}
.key.down { --fill: var(--c); color: var(--black); }
.key .words { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.key .hint { position: absolute; right: 12px; bottom: 8px; opacity: 0.7; }
.key .sub { opacity: 0.7; }
.key.small .hint { position: relative; right: auto; bottom: auto; margin-left: 6px; }
.key.small { height: 30px; padding: 0 12px; }
.key.small::before { border-width: 2px; }
.key.green { --c: var(--green); }
.key.orange { --c: var(--orange); }
.key.violet { --c: var(--violet); }
.key.white { --c: var(--white); --fill: var(--white); color: var(--black); }
.key.white.down { --fill: var(--black); color: var(--white); }
/* dice: white-rimmed cards, each tilted its own way as in the tray */
.key.card { --c: var(--white); }
.key.card::before { transform: rotate(-3deg); }
.key.card:nth-child(2n)::before { transform: rotate(2.5deg); }
.key.card:nth-child(3n)::before { transform: rotate(-2deg); }
</style>
</head>
<body>
<div id="bar">
    <a class="btn" id="games" href="./" hidden></a>
    <span class="name" id="name"></span>
    <span id="rec"></span>
    <span class="btn" id="disk"></span>
    <span class="btn" id="look"></span>
    <span class="btn" id="kb"></span>
    <span class="btn" id="send"></span>
</div>
<div id="main">
    <div id="stage">
        <div id="screen-wrap">
            <canvas id="screen" width="560" height="192"></canvas>
            <div id="start"></div>
        </div>
    </div>
    <div id="side">
        <div id="keyboard"></div>
        <div id="pad"></div>
    </div>
</div>
<div id="status"></div>
<script src="font.js"></script>
<script src="pad.js"></script>
<script src="machine.js"></script>
<script src="player.js"></script>
</body>
</html>
